# TODO: согласвать общее имя проекта.
name: athletelink-backend

services:
  api-gateway:
    # TODO: указать Dockerfile
    # TODO: выяснить внутренний HTTP-порт gateway и свободный порт на компьютере.
    # TODO: добавить ТОЧНЫЕ имена переменных из конфигурации gateway: адреса
    environment: {}
    networks:
      - backend

  auth-service:
    # TODO: указать существующий образ Auth Service и его тег.
    # image: ${AUTH_SERVICE_IMAGE:?Specify AUTH_SERVICE_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Specify AUTH_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?Specify AUTH_REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # TODO: передать JWT_SECRET вне Git при настройке Auth Service.
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  auth-db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Specify AUTH_DB_PASSWORD}
    ports:
      - "127.0.0.1:1234:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:8-alpine
    environment:
      REDISCLI_AUTH: ${AUTH_REDIS_PASSWORD:?Specify AUTH_REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${AUTH_REDIS_PASSWORD:?Specify AUTH_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q '^PONG$'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - backend

  kafka-init:
    image: apache/kafka:4.1.2
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic user.changes --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic notification.messages.requested --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

# Данные БД, Redis и Kafka переживут пересоздание контейнеров.
# Удаление соответствующего volume удалит сохранённые данные.
volumes:
  auth-db-data:
  auth-redis-data:
  kafka-data:
  game-db-data:
