stages:
  - deploy
 
.deploy_template:
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null" > ~/.ssh/config
    - chmod 600 ~/.ssh/id_ed25519
 
deploy-job:
  image: docker:27
  stage: deploy
  extends: .deploy_template
  script:
    - scp -i ~/.ssh/id_ed25519 docker-compose.yaml root@$SSH_REMOTE_HOST:/root/projects/atheletelink/docker-compose.yaml
    - |
      ssh -i ~/.ssh/id_ed25519 root@$SSH_REMOTE_HOST "
        cd /root/projects/atheletelink &&
        export JWT_SECRET='$JWT_SECRET' &&
        export EMAIL_ADDRESS='$EMAIL_ADDRESS' &&
        export EMAIL_PASSWORD='$EMAIL_PASSWORD' &&
        export EMAIL_SENDER_ADDRESS='$EMAIL_SENDER_ADDRESS' &&
        docker compose pull &&
        docker compose up -d --remove-orphans
      "
  only:
    - main
  when: manual
 